<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facturador ARCA — Monotributo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="brand">Facturador ARCA</div>
    <nav>
      <a href="{{ url_for('emitir') }}" class="{{ 'active' if request.endpoint == 'emitir' }}">Emitir</a>
      <a href="{{ url_for('parametrizaciones') }}" class="{{ 'active' if request.endpoint == 'parametrizaciones' }}">Parametrizaciones</a>
    </nav>
    <div class="env {{ 'homo' if cfg.HOMOLOGACION else 'prod' }}">
      {{ 'HOMOLOGACIÓN' if cfg.HOMOLOGACION else 'PRODUCCIÓN' }}
    </div>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
